
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

    <nav class="navbar">
        <h2 class="logo">WelcomeSite</h2>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="service.html">Services</a></li>
            <li><a href="form.html">Contact Us</a></li>
        </ul>
    </nav>

   
<section class="contact-section">
    <div class="contact-container">

        <!-- Logo -->
        <div class="form-logo">
            <img src="static/images/logo.png" alt="WelcomeSite Logo">
        </div>

        <h1>Contact Us</h1>
        <p>Have a question? Send us a message below.</p>

        <!-- Keep your existing form here -->
        <form action="#" method="post">

            <!-- Full Name -->
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>

            <!-- Email -->
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <!-- Age -->
            <label for="age">Age</label>
            <input type="number" id="age" name="age"
                   placeholder="Enter your age" min="1" max="120" required>

            <!-- Gender -->
            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <!-- Subject -->
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject"
                   placeholder="Enter the subject" required>

            <!-- Message -->
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6"
                      placeholder="Write your message here..."
                      required></textarea>

            <button type="submit">Send Message</button>
        </form>

    </div>
</section>


   

</body>
</html>
